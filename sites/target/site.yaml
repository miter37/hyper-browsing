site:
  id: target
  name: Target
  version: 1
match:
  hosts:
    - www.target.com
    - target.com
fingerprints: {}
states: {}
elements: {}
extractors: {}
preconditions: {}
urlTemplates:
  search: https://www.target.com/s?searchTerm={query}
  search_price_low: https://www.target.com/s?searchTerm={query}&sortBy=PriceLow
actions:
  search:
    description: Product search for {query}
    risk: read
    lifecycle: candidate
    knowledge:
      capability: search
      scope: Opened live and checked on 2026-11-12; the URL is verified after loading.
    implementation:
      kind: declarative
      steps:
        - op: goto
          urlTemplate: search
    verify:
      - type: url_matches
        pattern: https://www.target.com/s*searchTerm=*
  search_price_low:
    description: Product search for {query}, lowest price first
    risk: read
    lifecycle: verified
    knowledge:
      capability: search_price_low
      scope: Opened live and checked on 2026-11-12; the URL is verified after loading.
    implementation:
      kind: declarative
      steps:
        - op: goto
          urlTemplate: search_price_low
    verify:
      - type: url_matches
        pattern: https://www.target.com/s*sortBy=PriceLow*
