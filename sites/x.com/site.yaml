site:
  id: x_com
  name: X (x.com)
  version: 3
match:
  hosts:
    - x.com
    - www.x.com
fingerprints:
  logged_in:
    any:
      - element: compose_box
states: {}
elements:
  compose_box:
    strategies:
      - testId: tweetTextarea_0
      - css: "div[contenteditable='true'][role='textbox']"
    description: Inline post composer
  post_button:
    strategies:
      - testId: tweetButtonInline
      - testId: tweetButton
    description: Post button of the composer
  like_button:
    strategies:
      - css: "article [data-testid='like']"
    description: Like button of a post
  reply_button:
    strategies:
      - testId: reply
    description: Reply button of a post
  reply_submit:
    strategies:
      - testId: tweetButton
    description: Reply submit button
  caret:
    strategies:
      - testId: caret
    description: Post menu button
  delete_menuitem:
    strategies:
      - role: menuitem
        name: Delete
    description: Delete item of the post menu
  confirm_delete:
    strategies:
      - testId: confirmationSheetConfirm
    description: Final delete confirmation
extractors: {}
preconditions: {}
urlTemplates:
  home: "https://x.com/home"
  profile: "https://x.com/{handle}"
actions:
  open_compose_home:
    description: Open the home timeline with the inline composer visible
    risk: read
    implementation:
      kind: declarative
      steps:
        - op: goto
          urlTemplate: home
    verify:
      - type: element_visible
        element: compose_box
  type_compose:
    description: Type text into the inline composer (does not post; check before posting)
    risk: local_write
    implementation:
      kind: declarative
      steps:
        - op: fill
          element: compose_box
          value: "{text}"
    verify:
      - type: element_visible
        element: compose_box
  post:
    description: Submit the composed post. Never replay; check the profile afterwards.
    risk: irreversible
    implementation:
      kind: declarative
      steps:
        - op: click
          element: post_button
    verify: []
  reply:
    description: Reply to a post (scroll the post into view first; the list is virtualized)
    risk: external_write
    implementation:
      kind: declarative
      steps:
        - op: click
          element: reply_button
        - op: fill
          element: compose_box
          value: "{text}"
        - op: click
          element: reply_submit
    verify: []
  like:
    description: Toggle like on a post
    risk: external_write
    implementation:
      kind: declarative
      steps:
        - op: click
          element: like_button
    verify: []
  delete_own_post:
    description: Delete an own post through its menu (irreversible)
    risk: irreversible
    implementation:
      kind: declarative
      steps:
        - op: click
          element: caret
        - op: click
          element: delete_menuitem
        - op: click
          element: confirm_delete
    verify: []
