site:
  id: walmart
  name: Walmart
  version: 1
match:
  hosts:
    - www.walmart.com
    - walmart.com
fingerprints: {}
states: {}
elements: {}
extractors: {}
preconditions: {}
urlTemplates:
  search: https://www.walmart.com/search?q={query}
  search_price_low: https://www.walmart.com/search?q={query}&sort=price_low
actions:
  search:
    description: Product search for {query}
    risk: read
    lifecycle: verified
    knowledge:
      capability: search
      scope: Opened live and checked on 2026-11-12; the URL is verified after loading.
    implementation:
      kind: declarative
      steps:
        - op: goto
          urlTemplate: search
    verify:
      - type: url_matches
        pattern: https://www.walmart.com/search*q=*
  search_price_low:
    description: Product search for {query}, lowest price first
    risk: read
    lifecycle: candidate
    knowledge:
      capability: search_price_low
      scope: Opened live and checked on 2026-11-12; the URL is verified after loading.
    implementation:
      kind: declarative
      steps:
        - op: goto
          urlTemplate: search_price_low
    verify:
      - type: url_matches
        pattern: https://www.walmart.com/search*sort=price_low*
