site:
  id: bestbuy
  name: Best Buy
  version: 1
match:
  hosts:
    - www.bestbuy.com
    - bestbuy.com
fingerprints: {}
states: {}
elements: {}
extractors: {}
preconditions: {}
urlTemplates:
  search: https://www.bestbuy.com/site/searchpage.jsp?st={query}&intl=nosplash
actions:
  search:
    description: Product search for {query}
    risk: read
    lifecycle: candidate
    knowledge:
      capability: search
      scope: Opened live and checked on 2026-11-12; the URL is verified after loading.
    implementation:
      kind: declarative
      steps:
        - op: goto
          urlTemplate: search
    verify:
      - type: url_matches
        pattern: https://www.bestbuy.com/site/*
