site:
  id: google
  name: Google Search
  version: 1
match:
  hosts:
    - www.google.com
    - google.com
fingerprints: {}
states: {}
elements:
  body:
    strategies:
      - css: body
    description: Auto-encoded from a successful discovery extraction.
extractors:
  read_body:
    element: body
    read: text
preconditions: {}
urlTemplates:
  search: https://www.google.com/search?q={query}&hl=en
actions:
  get_body:
    description: Read read_body learned from discovery
    risk: read
    lifecycle: candidate
    implementation:
      kind: declarative
      steps: []
    returns:
      extractor: read_body
    verify:
      - type: extractor_exists
        extractor: read_body
  search:
    description: Web search for {query}
    risk: read
    lifecycle: candidate
    knowledge:
      capability: search
      scope: Opened live and checked on 2026-11-12; the URL is verified after loading.
    implementation:
      kind: declarative
      steps:
        - op: goto
          urlTemplate: search
    verify:
      - type: url_matches
        pattern: https://www.google.com/search*q=*
