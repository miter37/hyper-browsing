site:
  id: amazon
  name: Amazon
  version: 1
match:
  hosts:
    - www.amazon.com
    - amazon.com
fingerprints: {}
states: {}
elements: {}
extractors: {}
preconditions: {}
urlTemplates:
  search: https://www.amazon.com/s?k={query}
  search_price_low: https://www.amazon.com/s?k={query}&s=price-asc-rank
actions:
  search:
    description: Product search for {query}
    risk: read
    lifecycle: verified
    knowledge:
      capability: search
      scope: Opened live and checked on 2026-11-12; the URL is verified after loading.
    implementation:
      kind: declarative
      steps:
        - op: goto
          urlTemplate: search
    verify:
      - type: url_matches
        pattern: https://www.amazon.com/s*k=*
  search_price_low:
    description: Product search for {query}, lowest price first
    risk: read
    lifecycle: candidate
    knowledge:
      capability: search_price_low
      scope: Opened live and checked on 2026-11-12; the URL is verified after loading.
    implementation:
      kind: declarative
      steps:
        - op: goto
          urlTemplate: search_price_low
    verify:
      - type: url_matches
        pattern: https://www.amazon.com/s*s=price-asc-rank*
