name: CI
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      # Headed-fallback scenarios need a display on Linux CI runners.
      - name: Test on Linux (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Test on Windows
        if: runner.os == 'Windows'
        run: npm test
