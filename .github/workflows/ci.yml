name: CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/native-mcp-*'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install browser and system dependencies (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install browser (Windows)
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - run: npm run typecheck
      - name: Native MCP protocol and packaging
        run: npm run test:mcp
      - name: npm package smoke-test
        run: npm pack --dry-run --json
      - run: npm run validate:sites
      - name: Learning tests
        run: npm run test:learning
      - name: Execution and regression tests (Linux virtual display)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: xvfb-run -a npm run test:execution
      - name: Execution and regression tests (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: npm run test:execution
      - name: Chrome manager scenarios
        if: ${{ !cancelled() }}
        run: npm run test:scenarios
      - name: Discovery tests
        if: ${{ !cancelled() }}
        run: npm run test:discovery
